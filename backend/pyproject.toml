[project]
name = "hr-hub"
version = "0.1.0"
description = "Cadence HR Intelligence Hub foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "pillow>=11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "pytesseract>=0.3",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
