# One command from this directory: docker compose up --build -d
# Builds the current backend and frontend. An empty pgdata volume is enough.
# This file is the local demo. ENVIRONMENT=local is what allows the tokens below.
# Production must set ENVIRONMENT=production and inject different tokens from a secret store.

x-backend-env: &backend-env
  ENVIRONMENT: local
  DATABASE_URL: postgresql+psycopg://hub:hub@postgres:5432/hub
  HUB_RECRUITER_TOKEN: dev-recruiter-token
  HUB_ENGINEER_TOKEN: dev-engineer-token
  STORAGE_DIR: /var/storage
  BACKUP_DIR: /var/backups
  PROCESSING_VERSION: "1"
  EXTRACTOR_PROVIDER: deterministic
  EMBEDDING_PROVIDER: local
  REQUIREMENT_PROVIDER: deterministic
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_DESTINATION: smtp

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build: ./backend
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: sh -c "alembic upgrade head && python -m app.bootstrap"

  api:
    build: ./backend
    environment:
      <<: *backend-env
    volumes:
      - storage:/var/storage
      - backups:/var/backups
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: on-failure
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    build: ./backend
    environment:
      <<: *backend-env
    volumes:
      - storage:/var/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    command: python -m app.jobs.worker

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_RECRUITER_TOKEN: dev-recruiter-token
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  storage:
  backups:
