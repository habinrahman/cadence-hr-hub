<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111c32" />
    <link rel="icon" href="/icons/icon-192.png" />
    <title>Offline · Cadence HR</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f2f4f7;
        color: #111a2e;
        font: 14px/1.5 system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      }
      header {
        background: #111c32;
        color: #fff;
        padding: 0 16px;
        height: 48px;
        display: flex;
        align-items: center;
        font-weight: 700;
      }
      header span {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 8px;
        border-radius: 3px;
        background: linear-gradient(135deg, #6b5bd2, #1f9467);
      }
      main {
        margin: 48px auto;
        max-width: 28rem;
        padding: 32px 24px;
        background: #fff;
        border: 1px solid #e1e5eb;
        border-radius: 2px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 16px;
        color: #5a6477;
      }
      a {
        color: #1a4fb5;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header><span aria-hidden="true"></span>Cadence HR</header>
    <main>
      <h1>You are offline</h1>
      <p>Cadence needs a connection to show candidate information. Nothing from your desk is stored on this device.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
